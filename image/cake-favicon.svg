<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cakePink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="100%" stop-color="#d63031"/>
    </linearGradient>
    <linearGradient id="cakeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="100%" stop-color="#0abde3"/>
    </linearGradient>
    <linearGradient id="cakeGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd32a"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffbe76"/>
      <stop offset="100%" stop-color="#ff4757"/>
    </radialGradient>
  </defs>

  <!-- Plate -->
  <ellipse cx="32" cy="58" rx="28" ry="4.5" fill="#f1f2f6" stroke="#ced6e0" stroke-width="1.5"/>

  <!-- Bottom Tier (Pink) -->
  <path d="M 10 44 Q 32 49 54 44 L 54 54 Q 32 59 10 54 Z" fill="url(#cakePink)"/>
  <!-- Bottom Frosting -->
  <path d="M 10 44 Q 14 48 18 44 Q 22 48 26 44 Q 30 48 34 44 Q 38 48 42 44 Q 46 48 50 44 Q 52 46 54 44" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Middle Tier (Cyan Blue) -->
  <path d="M 16 33 Q 32 37 48 33 L 48 43 Q 32 47 16 43 Z" fill="url(#cakeBlue)"/>
  <!-- Middle Frosting -->
  <path d="M 16 33 Q 20 37 24 33 Q 28 37 32 33 Q 36 37 40 33 Q 44 37 48 33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Tier (Golden Cream) -->
  <path d="M 22 23 Q 32 26 42 23 L 42 32 Q 32 35 22 32 Z" fill="url(#cakeGold)"/>
  <!-- Top Frosting -->
  <path d="M 22 23 Q 26 26 30 23 Q 34 26 38 23 Q 40 25 42 23" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Strawberries / Cherries on Top -->
  <circle cx="25" cy="22" r="2.2" fill="#ff4757"/>
  <circle cx="39" cy="22" r="2.2" fill="#ff4757"/>

  <!-- Candle -->
  <rect x="30" y="11" width="4" height="11" rx="1.5" fill="#ffffff" stroke="#ff6b81" stroke-width="0.8"/>
  <line x1="30.5" y1="14" x2="33.5" y2="16" stroke="#ff4757" stroke-width="0.8"/>
  <line x1="30.5" y1="18" x2="33.5" y2="20" stroke="#ff4757" stroke-width="0.8"/>

  <!-- Wick -->
  <line x1="32" y1="11" x2="32" y2="8.5" stroke="#2d3436" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Glowing Flame -->
  <path d="M 32 2 C 34.5 5 35.5 7 34.5 9 C 33.5 10.5 30.5 10.5 29.5 9 C 28.5 7 29.5 5 32 2 Z" fill="url(#flameGrad)"/>
</svg>
